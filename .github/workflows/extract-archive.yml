name: Extract launcher archive

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract uploaded ZIP
        run: |
          mkdir -p source
          unzip -q "cleanyourtv-main (2).zip" -d source
          find source -type d -name .git -prune -exec rm -rf {} +
          test -n "$(find source -type f -print -quit)"

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source
          if git diff --cached --quiet; then
            echo "No extracted source changes to commit."
          else
            git commit -m "Extract launcher source archive"
            git push origin HEAD:main
          fi
