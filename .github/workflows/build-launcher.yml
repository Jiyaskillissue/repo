name: Build TV launcher

on:
  push:
    branches: [main]
    paths:
      - "source/cleanyourtv-main/launcher/**"
      - ".github/workflows/build-launcher.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch curated aerial wallpapers
        shell: bash
        run: |
          set -euo pipefail
          dir="source/cleanyourtv-main/launcher/app/src/main/assets/wallpapers"
          mkdir -p "$dir"
          urls=(
            "photo-1632647697343-4ba230062fba"
            "photo-1584640161267-869f0aa03af6"
            "photo-1724271362985-7815c11fc252"
            "photo-1744968776876-283d9ae15eb0"
            "photo-1738924381588-e6c495d1a862"
            "photo-1682536460259-b40cef108baa"
            "photo-1736776256361-360f071c2540"
            "photo-1723527256102-59bc79eb4d8f"
            "photo-1697223243328-fdd5c3ae34da"
            "photo-1767857393552-9e6a7a7e669a"
            "photo-1649934126054-7687cdcef7d1"
            "photo-1477901701740-5304fcfcb7fa"
          )
          for i in "${!urls[@]}"; do
            n=$(printf "%02d" "$((i + 1))")
            target="$dir/curated-$n.jpg"
            tmp="$target.tmp"
            url="https://images.unsplash.com/${urls[$i]}?fm=jpg&fit=crop&w=1600&h=900&q=78"
            if curl --fail --location --silent --show-error --retry 2 --connect-timeout 10 --max-time 60 "$url" -o "$tmp"; then
              mime="$(file --brief --mime-type "$tmp" || true)"
              size="$(wc -c < "$tmp")"
              if [[ "$mime" == "image/jpeg" && "$size" -gt 20000 ]]; then
                mv "$tmp" "$target"
                echo "Wallpaper $n fetched successfully ($size bytes)."
              else
                rm -f "$tmp"
                echo "Wallpaper $n unavailable or invalid; the launcher will generate a fallback."
              fi
            else
              rm -f "$tmp"
              echo "Wallpaper $n could not be fetched; the launcher will generate a fallback."
            fi
          done
          ready=$(find "$dir" -maxdepth 1 -type f -name 'curated-*.jpg' -size +20k | wc -l)
          echo "$ready/12 valid landscape photos ready for APK packaging."

      - name: Run tests and build release APK
        working-directory: source/cleanyourtv-main/launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-launcher-release
          path: source/cleanyourtv-main/launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
