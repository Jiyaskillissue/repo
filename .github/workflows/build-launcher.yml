name: Build TV launcher

on:
  push:
    branches: [main]
    paths:
      - "source/cleanyourtv-main/launcher/**"
      - ".github/workflows/build-launcher.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests and build release APK
        working-directory: source/cleanyourtv-main/launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-launcher-release
          path: source/cleanyourtv-main/launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
